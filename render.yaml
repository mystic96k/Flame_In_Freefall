# Blueprint de Render: New → Blueprint → elige tu repo de GitHub.
services:
  - type: web
    name: firefall
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false          # Render te la pide al crear el servicio (no queda en GitHub)
      - key: ALLOW_DEMO_DATA
        value: "true"
