# Blueprint de Render: New → Blueprint → elige tu repo de GitHub.
services:
  - type: web
    name: firefall
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false          # Render te la pide al crear el servicio (no queda en GitHub)
      - key: ALLOW_DEMO_DATA
        value: "true"
